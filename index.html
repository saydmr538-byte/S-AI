
<!DOCTYPE html>
<html lang="bn">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#151d32">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-AI Personal Assistant</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 18px;
  background: #151d32;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 45px;
  height: 45px;
  background: linear-gradient(135deg,#755cff,#00c9ff);
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: bold;
}

#chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.welcome {
  margin: auto 0;
  text-align: center;
  color: #cbd5e1;
}

.welcome h1 {
  color: #65aaff;
  margin-bottom: 12px;
}

.message {
  max-width: 85%;
  padding: 13px 15px;
  border-radius: 15px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #6355dc;
}

.bot {
  align-self: flex-start;
  background: #1b2940;
}

footer {
  padding: 12px;
  background: #151d32;
  display: flex;
  gap: 9px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #34425d;
  border-radius: 13px;
  background: #0b1020;
  color: white;
  font-size: 15px;
}

button {
  width: 60px;
  border: none;
  border-radius: 13px;
  background: #6355dc;
  color: white;
  font-size: 22px;
}
</style>
</head>

<body>

<header>
  <div class="logo">S</div>
  <div>
    <h2>S-AI</h2>
    <p>Personal AI Assistant</p>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>Hello, I'm S-AI</h1>
    <p>তোমার নিজের AI Assistant-এ স্বাগতম।<br>
    আজ কীভাবে সাহায্য করতে পারি?</p>
  </div>
</main>

<footer>
  <input id="userInput" type="text"
  placeholder="Ask anything...">
  <button id="sendBtn" type="button">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();

  if (text === "") return;

  addMessage(text, "user");
  input.value = "";

  let reply = "আমি S-AI। তোমার মেসেজ পেয়েছি! আমার আসল AI Brain এখনো যুক্ত করা হয়নি।";

  const msg = text.toLowerCase();

  if (msg.includes("hello") || msg.includes("hi")) {
    reply = "Hello! আমি S-AI। কীভাবে সাহায্য করতে পারি?";
  }
  else if (
    msg.includes("tomar name") ||
    msg.includes("tomar nam") ||
    msg.includes("তোমার নাম")
  ) {
    reply = "আমার নাম S-AI। আমি তোমার Personal AI Assistant!";
  }
  else if (
    msg.includes("kemon acho") ||
    msg.includes("কেমন আছ")
  ) {
    reply = "আমি ভালো আছি! তুমি কেমন আছো?";
  }
  else if (msg.includes("তোমাকে কে বানিয়েছে")) {
    reply = "আমাকে তুমি তৈরি করছো!";
  }

  setTimeout(function() {
    addMessage(reply, "bot");
  }, 500);
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("S-AI Ready"))
      .catch(error => console.log(error));
  });
}
</script>
</body>
</html>
